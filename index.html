

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobConnect - Find Jobs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #173b70;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 6px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    .job {
      background: white;
      margin-top: 14px;
      padding: 16px;
      border-radius: 8px;
    }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <h1>JobConnect</h1>
    <p>Find your dream job today!</p>
  </header>

  <main>
    <h2>Search Jobs</h2>
    <input id="search" placeholder="Enter job title or location">
    <button type="button" id="searchBtn">Search Jobs</button>
    <p id="status">Loading jobs...</p>
    <div id="results"></div>
  </main>

  <script>
    const API_URL =
      "https://jobconnect-portal-2ik0.onrender.com/api/jobs";

    let jobs = [];

    function showJobs(list) {
      const results = document.getElementById("results");
      results.replaceChildren();

      if (list.length === 0) {
        results.textContent = "No matching jobs found.";
        return;
      }

      list.forEach(job => {
        const card = document.createElement("div");
        card.className = "job";

        const title = document.createElement("h3");
        title.textContent = job.title || "Untitled Job";

        const company = document.createElement("p");
        company.textContent =
          "Company: " + (job.company || "Not specified");

        const location = document.createElement("p");
        location.textContent =
          "Location: " + (job.location || "Not specified");

        const description = document.createElement("p");
        description.textContent = job.description || "";

        const salary = document.createElement("p");
        salary.textContent = "Salary: " + (job.salary || "Not specified");

        const type = document.createElement("p");
        type.textContent = "Type: " + (job.type || "Not specified");

        const applyBtn = document.createElement("button");
applyBtn.textContent = "Apply Now";

applyBtn.onclick = function () {
  alert("Thank you for your interest! Please contact JobConnect to apply.");
};

card.appendChild(applyBtn);
        results.appendChild(card);
      });
    }

    async function loadJobs() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Could not load jobs");

        jobs = await response.json();
        status.textContent = jobs.length + " job(s) available";
        showJobs(jobs);
      } catch (error) {
        status.textContent =
          "Unable to load jobs. Please refresh and try again.";
        status.className = "error";
      }
    }

    
function searchJobs() {
  const query = document.getElementById("search").value.trim().toLowerCase();

  const filteredJobs = jobs.filter(job => {
    const title = String(job.title || "").toLowerCase();
    const company = String(job.company || "").toLowerCase();
    const location = String(job.location || "").toLowerCase();
    const description = String(job.description || "").toLowerCase();

    return title.includes(query) ||
           company.includes(query) ||
           location.includes(query) ||
           description.includes(query);
  });

  showJobs(filteredJobs);
}


  document.getElementById("searchBtn").addEventListener("click", searchJobs);
loadJobs();
  </script>
</body>
</html>
